architecture:
  style: Next.js App Router with route handlers
  client_data: simulated in the browser
  server_data: Supabase through route handlers when a session exists
  client_calls_server: false
  entrypoints:
    - path: /
      kind: page
      auth: none
    - path: /feed
      kind: page
      auth: none
    - path: /dashboard
      kind: page
      auth: none
    - path: /api/flood-reports
      kind: route
      methods:
        - GET
        - POST
      auth: session required
    - path: /api/flood-alerts
      kind: route
      methods:
        - GET
      auth: session required
  middleware:
    file: middleware.ts
    matcher:
      - /api/:path*
      - /dashboard/:path*
    rejects_missing_session_on:
      - /api
    does_not_reject_missing_session_on:
      - /dashboard
  data_flow: >
    Pages render client components that resolve fake data locally. Middleware
    and route handlers are a separate path used only when something requests
    /api. Nothing in the UI does that today.
  tables_in_migration:
    - users
    - flood_alerts
    - flood_reports
  tables_in_vision_doc_not_in_migration:
    - Location
    - UserLocation
    - Region
    - Sensor
    - SensorData
    - Alert
    - Forecast

risks:
  - id: R1
    severity: high
    confidence: high
    title: Demo and API disagree
    claim: The pages never call the routes, so a successful toast is not a stored report.
    evidence: components/report-form.tsx
  - id: R2
    severity: high
    confidence: high
    title: No sign-in path
    claim: The API requires a user and the UI cannot create one.
    evidence: components/main-nav.tsx and live HTTP 404 on /login
  - id: R3
    severity: high
    confidence: high
    title: Migration is not wired for Supabase Auth
    claim: RLS has no policies, and user_id references public.users, which nothing fills.
    evidence: supabase/migrations/20250329162200_initial_schema.sql
    hosted_database: null
  - id: R4
    severity: high
    confidence: high
    title: Docs overclaim
    claim: Overview, data-models, API doc, and ADR 001 describe behavior the tree does not have.
    evidence: docs/project-overview.md and docs/architecture/decisions/001-authenticated-reports.md
  - id: R5
    severity: medium
    confidence: high
    title: Build ignores typecheck and lint
    claim: next.config.mjs will ship type errors, including unknown Badge variants.
    evidence: next.config.mjs and components/ui/badge.tsx
  - id: R6
    severity: medium
    confidence: medium
    title: Geography insert format is unproven
    claim: The route inserts a bare POINT string into a geography column.
    evidence: app/api/flood-reports/route.ts
  - id: R7
    severity: medium
    confidence: high
    title: Report list is not scoped to the caller
    claim: GET selects all flood_reports for any signed-in user, with no user_id filter.
    evidence: app/api/flood-reports/route.ts
  - id: R8
    severity: low
    confidence: high
    title: Dead browser client throws if imported
    claim: lib/supabase.ts throws when public env vars are missing, and nothing imports it.
    evidence: lib/supabase.ts

