teaching_hooks:
  - id: H1
    seconds: 15
    hook: The toast says the flood report was submitted. The form never called the server.
    concept: A success message is not a persistence proof.
  - id: H2
    seconds: 15
    hook: The API returns 401, which is the honest part, and the button that would sign you in does nothing.
    concept: An auth gate without a login page blocks the product and protects an empty path.
  - id: H3
    seconds: 15
    hook: Turning on row level security with no policy does not mean the table is ready. It means the table is closed.
    concept: RLS default deny.
  - id: H4
    seconds: 15
    hook: The overview describes sensors and prediction. The page describes five fake dots. Read the page.
    concept: Vision doc versus tree.
  - id: H5
    seconds: 15
    hook: The spec says Done, the verification log is empty, and the dashboard says 87 percent accuracy because someone typed it.
    concept: Status words need evidence.
