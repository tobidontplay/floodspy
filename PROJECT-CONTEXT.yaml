    - id: S4
      statement: Real-time monitoring, personalized multi-channel alerts, sensors, weather, and prediction for residents, responders, planners, and analysts.
      source: docs/project-overview.md
      success_criteria: null
      met: false
    - id: S5
      statement: SMS, prediction, and planner tools are out of scope for the current tree.
      source: specs/project-brief.md
      success_criteria: Those systems are absent from application code.
      met: true
    - id: S6
      statement: Confirm whether FloodSpy stays in the fleet.
      source: TODO.md
      success_criteria: null
      met: null
  inferred:
    - id: I1
      statement: Present a clickable Nigeria flood demo that does not need credentials.
      source: components/flood-map.tsx
      confidence: medium
    - id: I2
      statement: Keep a Supabase write path for a later connection.
      source: app/api/flood-reports/route.ts
      confidence: medium
    - id: I3
      statement: The relief feed and project creator are a side screen, not the monitoring spec.
      source: app/feed/page.tsx
      confidence: medium
    - id: I4
      statement: The owner published the demo.
      source: https://floodspy.vercel.app
      confidence: medium
    - id: I5
      statement: September 2026 work was fleet paperwork, not product behavior.
      source: git log 5464192 and 1ad788c
      confidence: high
  non_goals:
    - SMS and email delivery
    - Predictive models
    - Sensor and weather ingestion
    - City-planner exports
    - A native mobile app
    - NextAuth as the wired login
    - A test suite, until one is added
    - Marking a feature accepted without the user
  target_user: >
    Stated target is a signed-in resident who reports a flood and a reader of
    the map and alerts. Reachable today is an anonymous visitor of a demo.
    Responder, planner, and analyst personas are named in the overview and
    have no role in code.
  success_criteria:
    - id: C1
      statement: Anonymous API create and read return 401.
      met: true
    - id: C2
      statement: A signed-in user can store a report from the form.
      met: false
    - id: C3
      statement: The map and alerts show stored rows.
      met: false
    - id: C4
      statement: Verification log has tests, manual, and user opinion for a feature.
      met: false
  questions_for_user:
    - Is the pause a stop, or a hold until the write path is real?
    - Should map and alert reads be public?
    - Should flood_reports.user_id reference auth.users instead of public.users?
    - Are /feed and the project creator in the product?
    - Is https://floodspy.vercel.app still the intended deploy?
    - Which dev port should project.yaml record?
    - Should the overview and docs/data-models.md be labeled vision?
    - Should feature frontmatter stay Done while the UI is simulated?

