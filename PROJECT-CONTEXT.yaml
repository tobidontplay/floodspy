# Ariadne project context for FloodSpy.
# Snapshot from a read-only audit on 2026-10-01.
# analysis_version: 1
# Unknown values are null. They are not omitted.
# Fleet status "paused" was supplied for this audit. The repo does not store that word.
# Feature acceptance is not claimed. verified_by stays null in the specs.

project:
  name: floodspy
  package_name: my-v0-project
  repo: tobidontplay/floodspy
  owner_github: tobidontplay
  owner_personal_name: null
  fleet_status: paused
  generator: v0.dev
  public_url: https://floodspy.vercel.app
  public_url_checked_on: "2026-10-01"
  default_branch: main
  last_application_commit: 6bd13ff
  last_application_commit_date: "2025-05-03"
  last_docs_commit: 1ad788c
  last_docs_commit_date: "2026-09-26"

purpose: >
  Crowdsourced flood monitoring for residents, aimed at Nigeria in the sample
  data. The home page is a demo of a map, a report form, and an alerts list.
  Two Supabase route handlers exist and reject anonymous callers. The pages
  do not call those routes. A longer vision document describes SMS, sensors,
  and prediction. That vision is not this tree.

stage: paused
maturity: prototype

last_analysis: "2026-10-01"

confidence:
  overall: medium
  code_reading: high
  live_http: high
  hosted_database: low
  reason: >
    The tree and the public HTTP checks are enough to classify the demo and
    the 401 gate. They are not enough to know whether the hosted Supabase
    project matches the SQL file, because no env file and no signed-in call
    were available.

analysis_version: 1

